apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-shards
  labels:
    app: kubecolors
    resource: database
spec:
  serviceName: database
  replicas: 3
  selector:
    matchLabels:
      app: kubecolors
      resource: database
      component: mongo
  template:
    metadata:
      labels:
        app: kubecolors
        resource: database
        component: mongo
    spec:
      containers:
        - name: mongo
          image: mongodb/mongodb-community-server:7.0-ubi8
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-root-creds
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-root-creds
                  key: MONGO_INITDB_ROOT_PASSWORD
          envFrom:
            - secretRef:
                name: db-creds
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            limits:
              memory: 512Mi
              cpu: 1000m
            requests:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            tcpSocket:
              port: 27017  # command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            failureThreshold: 3
            periodSeconds: 10
            initialDelaySeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: color-data
              mountPath: /data/db
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: db-init
          configMap:
            name: db-init
  volumeClaimTemplates:
    - metadata:
        name: color-data
        labels:
          app: kubecolors
          resource: database
          component: storage
      spec:
        accessModes: [ "ReadWriteOncePod" ]
        storageClassName: hostpath
        resources:
          requests:
            storage: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: database
  labels:
    app: kubecolors
    resource: database-service
spec:
  clusterIP: None
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  selector:
    app: kubecolors
    resource: database
    component: mongo
