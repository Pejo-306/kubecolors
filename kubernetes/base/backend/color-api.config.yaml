apiVersion: v1
kind: ConfigMap
metadata:
  name: color-api-config
  labels:
    app: kubecolors
    resource: backend-config
data:
  config.json: |
    {
      "database": {
        "statefulSet": "mongo-shards",
        "service": "database",
        "replicas": 3,
        "port": 27017
      }
    }