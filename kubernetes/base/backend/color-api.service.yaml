apiVersion: v1
kind: Service
metadata:
  name: color-api
  labels:
    app: kubecolors
    resource: backend-service
spec:
  selector:
    app: kubecolors
    resource: backend
    component: color-api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: color-svc-nodeport
  labels:
    app: kubecolors
    resource: backend-nodeport-service
spec:
  type: NodePort
  selector:
    app: kubecolors
    resource: backend
    component: color-api
  ports:
    - name: http
      port: 80
      targetPort: 80
