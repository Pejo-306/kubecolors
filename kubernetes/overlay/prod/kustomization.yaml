apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubecolors-prod

resources:
  - prod-namespace.yaml
  - ../../base

images:
  - name: penikolov23/color-api
    newTag: "2.0.1"

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: color-api-config
    behavior: replace
    files:
      - config.json=config/config.json

patches:
  # GKE premium storage class
  - target:
      kind: StatefulSet
      name: mongo-shards
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: premium-rwo

  - path: patches/mongo-cpu-gke.yaml
  - path: patches/mongo-node-affinity.yaml
  - path: patches/mongo-fsgroup.yaml

  - target:
      kind: StatefulSet
      name: mongo-shards
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      kind: Deployment
      name: color-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - path: patches/color-api-service-gke.yaml
  - path: patches/color-api-cpu-gke.yaml
