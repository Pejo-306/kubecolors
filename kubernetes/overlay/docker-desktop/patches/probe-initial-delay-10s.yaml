# Local Docker Desktop: shorter probe delays than base (faster feedback on laptop).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-api
spec:
  template:
    spec:
      containers:
        - name: color-api
          startupProbe:
            initialDelaySeconds: 10
          livenessProbe:
            initialDelaySeconds: 10
          readinessProbe:
            initialDelaySeconds: 10
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-shards
spec:
  template:
    spec:
      containers:
        - name: mongo
          startupProbe:
            initialDelaySeconds: 10
          livenessProbe:
            initialDelaySeconds: 10
